[package]
name = "skep-content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M4 — the permascroll: an append-only, write-once map from allocated I-address to opaque content value, plus the two point queries over it (contains / value_at)"
readme = "README.md"

[features]
# `test-hooks` compiles in the test-only surface: `write`, the standalone
# transact-wrapped twin of `stage_write` the composition contract asks for.
# Committed alone a content write has no placement (J0), so production writes
# through M5's placement composite and never through it. DEFAULT-OFF: this
# crate's suite turns it on through the self dev-dependency below, so a build
# that compiles no test compiles none of it — nor the two crate edges only it
# takes.
test-hooks = ["dep:skep-kernel", "dep:skep-namespace"]

[dependencies]
# The design's mandated slice shape (§Core data model): a persistent HAMT for
# the address→value map — apply_write shares all untouched structure with the
# prior slice, so live snapshots pinning old Worlds are nearly free. The slice
# is fully serialized in checkpoints (no skip-serialize), through serde impls
# of M4's own — the sorting `Serialize` and `entry_by_entry` (src/store.rs) —
# so none of im's feature-gated serde impls is used here.
im.workspace = true
# Open build decision #5: the FixedHasher alias's concrete pick —
# BuildHasherDefault<FxHasher>, fixed-seed and deterministic. Checkpoint bytes
# do not depend on it (the slice's Serialize sorts its entries); it stays for
# its cost and its bounds (the alias in src/store.rs says which).
rustc-hash.workspace = true
# rc for the Arc<[u8]> impls behind Val (§Types & errors).
serde = { workspace = true, features = ["rc"] }
# M1 — Tumbler/Address; Level and content_subspace for the routing assertion
# (src/routing.rs), document_of for `write`. M4 holds no address algebra of
# its own.
skep-address = { path = "../skep-address" }
# M2 — `write` alone (`test-hooks`): Kernel, Seq, TxnError, WorldState. The
# library proper names no kernel item: it rides M2 for atomicity, ordering,
# durability and recovery through the engine's fold and M5's composites, and
# owns no journal, replay loop, snapshot, or recovery story of its own.
skep-kernel = { path = "../skep-kernel", optional = true }
# M3 — `write` alone (`test-hooks`): M3State::content_lock_key, the
# workspace's one source of those key bytes; see the OPEN DECISION note at
# `write`. No M3 state is ever read.
skep-namespace = { path = "../skep-namespace", optional = true }

[dev-dependencies]
# This crate itself with `test-hooks` on, so its integration tests (tests/it,
# outside this library's `cfg(test)`) compile against `write` under a plain
# `cargo test` or workspace run, no flag added. A build that compiles no test
# never reads this table.
skep-content = { path = ".", features = ["test-hooks"] }
# The suite drives M2 itself and takes M3's content key for the composite
# test, so it names both crates whatever the library's features.
skep-kernel = { path = "../skep-kernel" }
skep-namespace = { path = "../skep-namespace" }
# bincode is M2's actual wire format — the round-trip tests exercise the real
# journal/checkpoint encoding; tempfile hosts the durable-recovery test.
bincode.workspace = true
tempfile.workspace = true
