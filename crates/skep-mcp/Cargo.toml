[package]
name = "skep-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The MCP adapter: JSON-RPC 2.0 over stdio on the agent side, skepd's HTTP/JSON wire on the other. One static binary an operator points a harness at; tool name → wire op is mechanical, skepd's response documents pass through verbatim, rejections are data."
readme = "README.md"

[dependencies]
# Both protocols are small enough to own — a written-out HTTP/1.1 client
# over std::net (skepd is one-request-per-connection, Connection: close),
# and newline-delimited JSON-RPC over stdio. JSON encoding is the one thing
# taken from a library.
serde_json.workspace = true

[dev-dependencies]
# The real stack: tests build a daemon in-process on an ephemeral port over
# a temp data dir, claim its board over the wire (an unclaimed daemon runs
# nothing but the claim ceremony — RES-27), provision a principal, and
# drive the built skep-mcp binary through its stdin/stdout. `test-hooks`
# compiles in `skepd::fuzz_support`, which tests/it/fuzz_mcp.rs drives.
skepd = { path = "../skepd", features = ["test-hooks"] }
# The ceremony's record grammar and session-payload framing.
skep-identity = { path = "../skep-identity" }
# The ceremony's signer: each seed carrier (`Ed25519SigningKey`, a
# `test-hooks` door — the one place a suite reaches a classical key type,
# since `skep-signature` alone links the signature libraries) and its hybrid
# key (`HybridSigner`), which signs the session blobs; the daemon only
# verifies.
skep-signature = { path = "../skep-signature", features = ["test-hooks"] }
