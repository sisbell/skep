[package]
name = "skep-links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M7 — Link & Relation Store: the authoritative append-only store of links and typed relations, the immutable type/shape registry, idempotent de-duplication, retraction/supersession, and the spanfilade discovery primitives"
readme = "README.md"

[dependencies]
# The design's mandated shapes (§Core data model): persistent im collections
# for the authoritative links map and every recomputable hint; the serde
# feature because the authoritative slice (the links map) rides M2
# checkpoints.
im.workspace = true
# Plain serde: the slice's serialized reach is `links` and the carrier types
# under it, none of which is reference-counted — M7's one `Arc` wraps the
# format registry, which is a compiled constant and rides no checkpoint, so
# the `rc` feature has nothing here to derive for.
serde.workspace = true
# M1 — tumbler/address/span algebra; M7 holds no address algebra of its own.
skep-address = { path = "../skep-address" }
# M2 — every write rides transact, every read rides a snapshot; the dedup
# LockKey draws its 1-byte space tag from M2's central Space enum.
skep-kernel = { path = "../skep-kernel" }
# M3 — mint_link + link_lock_key inside every emit composite; the
# home-registration precondition reads.
skep-namespace = { path = "../skep-namespace" }
# M5 — resolve/Run::iextent for MAKELINK's V→I endset construction and
# stage_seat_link for the home seat (the M7→M5 edge with no return).
skep-arrangement = { path = "../skep-arrangement" }

[dev-dependencies]
# bincode is M2's actual wire format — the round-trip tests exercise the real
# checkpoint encoding; skep-content lets the test world drive M5's INSERT so
# MAKELINK has arranged content to resolve.
bincode.workspace = true
skep-content = { path = "../skep-content" }
