[package]
name = "skepd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The skep daemon: one long-running process owning one World, serving the full M10 operation surface over HTTP/JSON to local clients. Transport, sessions, configuration, and process lifetime — no semantics but the three the spec gives it: the session layer's gates, the published head's cadence and the media door."
readme = "README.md"

[features]
# `observe` forwards the engine's WorldDump surface as GET /dump. Default-ON
# so the workspace gate exercises the route and the restart test's dump
# equality; a build without it simply has no /dump route.
default = ["observe"]
observe = ["skep-engine/dump"]
# `client` embeds skep/clients/board.html (include_str! at build — the
# binary is self-contained) and serves it at GET /. **DEFAULT-OFF, and
# the default is the SAFE state** (owner ruling 2026-08-22): the client
# served at GET / is an ACTING client — it generates keys and opens
# signed sessions — and R89 (THE CLIENT RULE, MUST) says a board may
# serve at most a read-only guest view and never one that acts. Left
# default-ON, a hosted image built without a deliberate opt-OUT serves a
# key-generating page at the HOST's origin; a member enrolls a key into
# their own doc 1 from that key store (the keyless-browser face guides
# them to), and the host can thereafter open signed sessions as that
# member — silently, and permanently, since I4 bars the key's removal
# from ever restoring the prior state. Default-off inverts the failure:
# forgetting the flag on a hosted image yields a correct board, and
# forgetting it on a notebook build yields no UI at all, which announces
# itself the moment anyone opens it. Packaged notebook builds enable it;
# the hosted image simply does not opt in, so ABSTENTION IS ENOUGH and
# no build-time obligation has to be remembered. A build without it has
# no / route (the usual 404 shape) until the guest reader exists, which
# is what GET / serves by default once it does.
# scripts/gate-full.sh compiles skepd with it on and reruns the tests whose
# answers turn on it, so the route stays exercised.
client = []
# `test-hooks` compiles in the test-only code: `Daemon`'s `#[doc(hidden)]`
# hooks (server/hooks.rs) and the claim-flip hold one of them arms, the
# `fuzz_support` harness, and the `Permit` re-export the pool hooks return —
# and turns on ONE thing in another crate: `skep-blobs`'s hazard seam, the
# hold at a named step of a finish that this crate's own blob-store hold
# (`Daemon::hold_blob_finish_at`, media lane B) is a door to. `skep-signature`'s
# signer and fixture hooks reach this crate's tests through their own
# dev-dependency line below, and a consumer that signs names the feature it
# needs on its own `skep-signature` line. DEFAULT-OFF, and the shipped
# binary never enables it: this crate's own tests turn it on through the
# self dev-dependency below, and skep-mcp's tests and skep/fuzz/ on their
# `skepd` lines, so a build that compiles no test compiles none of it.
test-hooks = ["skep-blobs/test-hooks"]

[dependencies]
# The assembled engine: Engine::open (genesis-or-recover), the Stores<World>
# factory, and (behind `observe`) the WorldDump surface.
skep-engine = { path = "../skep-engine", default-features = false }
# M10 — the operation surface this daemon transports: OperationSurface, Op/Response,
# the Codec seam, and the typed Rejection model.
skep-febe = { path = "../skep-febe" }
# M2 — KernelConfig/Durability/CheckpointPolicy (durability is configuration,
# chosen here) and Seq.
skep-kernel = { path = "../skep-kernel" }
# The wire value types the codec round-trips, each from its owning crate.
skep-address = { path = "../skep-address" }
skep-namespace = { path = "../skep-namespace" }
skep-content = { path = "../skep-content" }
skep-arrangement = { path = "../skep-arrangement" }
skep-retrieval = { path = "../skep-retrieval" }
skep-links = { path = "../skep-links" }
skep-discovery = { path = "../skep-discovery" }
# The AUTH identity vocabulary: the credential data model, key sets, the
# classify oracle and the entry frame's rows. The fold itself is the
# engine's — the World's identity slice (AUTH-2.79) — which skepd reads.
skep-identity = { path = "../skep-identity" }
# THE REGISTRY'S CORE AS VALUES: the twelve commons rows, the binding and
# endpoint bodies under one canonical rule, and the seeding check — read
# by the registry sequence's parse (`auth/policy/registry.rs`) and run by
# the open ahead of every genesis.
skep-registry = { path = "../skep-registry" }
# THE BLOB STORE (media lane B): the files, the partials, the upload records
# and the lease log under `blobs/` in the data dir — the PUT's fsync order
# and the lease's honest-null answer. It knows no principal, lock or limits
# record; the daemon's gate (`media/gate.rs`) is what reads those.
skep-blobs = { path = "../skep-blobs" }
# THE HYBRID ENTRY SIGNATURE's frozen rules (signed ops): `skep-signature` is
# the one crate that links the signature libraries; skepd calls its verify
# (AUTH-2.2) — the session verify, the write-path check — and its all-halves
# decode, the enrollment courtesy's. NO feature: its `sign` half (the KDF,
# keygen, signing) stays out of the daemon's build, which holds no signer
# (AUTH-2.89); the tests' line below turns it on for test builds alone.
skep-signature = { path = "../skep-signature" }
# OS entropy for nonces and session tokens (AUTH-4.13: at least 128 bits per
# token from a CryptoRng, never a per-process prefix plus a counter), and
# the `CryptoRng` bound the auth surface's declared signatures carry.
getrandom = "0.3"
rand_core = "0.9"
# JSON frames. The codec builds Values through its own key-sorting obj()
# helper, so marshal determinism never depends on serde_json's map backend.
serde_json.workspace = true
# No HTTP server dependency, deliberately (wire v4): the daemon speaks a
# written-out HTTP/1.1 subset over std's TcpListener; server.rs's module doc
# carries why a pull-based server library cannot serve the commit stream.
# No async runtime either: M2's single applier already serializes writes and
# OperationSurface::execute is Sync, so worker threads are the whole concurrency
# story.
#
# Non-poisoning locks, used for EVERY lock this crate holds (the same
# totality argument M10 §7 makes): a panic under one releases it with the
# data as it stands, which is what serve_connection's unwind note rests on.
# Deliberately no inventory here — a list in a manifest goes stale in silence
# while the argument does not.
parking_lot.workspace = true
# THE RESET CLOSE of a blob fetch stream (media/serve.rs; server/http.rs):
# `SO_LINGER` at zero on the one socket option std does not expose, so a
# stream the mid-stream re-check ends sends a reset and never a clean finish
# a client could read as the whole file. The `net` feature alone.
rustix = { version = "1", features = ["net"] }
# BLAKE3 at the fetch's check (media/serve.rs): the whole file hashed against
# the cell's `hash` before its first byte is served — the designation the
# store deposits under; the suites hash with it too, judging the daemon's
# answer against their own (Q-sm2).
blake3.workspace = true

[dev-dependencies]
# This crate itself with `test-hooks` on, so its integration tests
# (tests/it, outside this library's `cfg(test)`) compile against the hooks
# under a plain `cargo test` or workspace run, no flag added. A build that
# compiles no test never reads this table, so the binary stays without them.
# `default-features = false`, so this line adds `test-hooks` and nothing
# else: with the implicit default it would switch `observe` back on in every
# test build, and the gate's `--no-default-features` check would compile the
# tests with the dump route after all.
skepd = { path = ".", features = ["test-hooks"], default-features = false }
tempfile.workspace = true
# The blob store with its hazard seam named, so the SIGKILL harness can name
# the step it holds a finish at (`skep_blobs::Step`). BLAKE3 the suites hash
# with is the dependency above.
skep-blobs = { path = "../skep-blobs", features = ["test-hooks"] }
# The TEST SIGNER and its fixture hooks (the daemon itself only verifies):
# the suites' fixed seed carriers are its `Ed25519SigningKey` — the 32 bytes
# that seed each hybrid key (`common::seed_of`), derived through
# `HybridSigner::from_seed`, which signs sessions and entries; the seeded
# RNG and the Ed25519 half come through the hooks, and the half's own
# `sign` makes the one Ed25519-only blob the suites send as a negative
# vector; its `Ed25519VerifyingKey` decode finds the non-point an
# undecodable key carries. `skep-signature` is the one crate that links the
# signature libraries, so no suite names `ed25519-dalek`.
skep-signature = { path = "../skep-signature", features = ["test-hooks"] }
# H4 property-based op sequences (tests/it/properties.rs): random-but-valid
# plans with shrinking; failure seeds persist to proptest-regressions/
# (pins, same standing as goldens).
proptest.workspace = true
# THE VERIFYING RESOLVER, taken as the library it is (tests/it/resolve.rs):
# the end-to-end cells and the measurements run here, where boards are
# spawned and registered. The daemon itself never depends on it.
skep-resolve = { path = "../skep-resolve" }
