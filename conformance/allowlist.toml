# skep conformance allowlist — ADJUDICATED divergences only.
#
# Format (restricted TOML subset, parsed by skep-conformance/src/allowlist.rs):
#   [[allow]]
#   scenario = "<golden scenario name>"
#   op_index = <0-based op index>          # optional; absent = whole scenario
#   class = "<short divergence class>"
#   rationale = "<one sentence citing the design doc / drift item / udanax finding>"
#   count_delta = <integer>                # optional declared count adjustment
#   width_tolerance = <integer>            # optional span-width tolerance
#

# Retraction-tuple class (D8): adjudicated intended; no golden exercises
# retraction (88.1 has no link deletion), so no concrete entry — see
# adjudication/decisions.md.
#
# Pre-registered (ASN-0122): udanax COMPARE under-reports fan-out (merge,
# not join — self-comparison reports only the diagonal). Any fan-out
# compare divergence where skep reports MORE pairs takes class
# udanax-compare-fanout-underreport.

