[package]
name = "skep-febe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M10 — Operation Surface (FEBE command layer): the uniform request lifecycle (parse → authorize → linearize → commit-gate → marshal → surface) over a static dispatch table, plus ephemeral session→principal binding and best-effort retry de-duplication"
readme = "README.md"

[dependencies]
# The design's mandated shapes (§Core data model): non-poisoning locks for the
# session table and the retry memo (a panic while a lock is held must not
# break `execute`'s Total contract) and the bounded LRU the memo's entries
# live in.
# Pointedly NOT `im`: no M10 field is ever snapshotted or replayed.
parking_lot.workspace = true
lru.workspace = true
# M1 — Address/Tumbler/Span/SpanSet/Nat for request/response payloads;
# `document_of` for the link-address absence rule and `subtree_of` for the
# unjudged successor's padding.
skep-address = { path = "../skep-address" }
# M2 — one snapshot per read and per write door (`seq`/`world`/`chain` off
# it), `current_seq` for `log_position`, `is_poisoned` behind the factory's
# poison report, `TxnError` on every write path, `Attestation` forwarded to
# every M5 and M7 driver a write acquires; the kernel is reached only through
# the Stores factory.
skep-kernel = { path = "../skep-kernel" }
# M3 — the four entity writes via the Namespace driver; off a snapshot, the
# registry and ω reads asked by the namespace reads, the door's deferral, the
# successor guard and the publication reads (`next_account_prefix`,
# `principal_prefix`, `effective_owner_pair`/`_prefix`,
# `is_registered_document`, `prefix_contains`).
skep-namespace = { path = "../skep-namespace" }
# M4 — four names, no call (design, Conflicts resolved #4): HasContent is a
# FebeWorld supertrait and ContentWrite the record lift Vstream::insert's bound
# requires; Val rides in Op::Insert's payload; ContentError is lowered when M5's
# insert or publish refuses through InsertError::Content or
# PublishError::Content. M10 calls no M4 function.
skep-content = { path = "../skep-content" }
# M5 — the six arrangement/versioning writes via the Vstream driver, each
# built carrying the request's attestation; `iter_resolve` +
# `content_run_count` + `Run::iextent` behind `as_ordinal_vspan` assemble
# editlink's successor (§4); `trunk_of`/`published_target`/`birth_version`,
# `birth_extent`/`shot_terms` and `Caller` for the door and the publication
# reads.
skep-arrangement = { path = "../skep-arrangement" }
# M6 — the seven content/provenance queries over M10's snapshot, and the one
# producer of FaultSite's `operand`, `region` and `fault` (§5); the site's
# other producers are listed on FaultSite.
skep-retrieval = { path = "../skep-retrieval" }
# M7 — the five link writes via the LinkWriter driver; readlink/followlink off a
# snapshot; Endset/enc/Link/View for argument construction.
skep-links = { path = "../skep-links" }
# M8 — the *_on reads, each over the snapshot M10 hands it, so M10 owns the
# snapshot and reports as_of (design, Conflicts #5).
skep-discovery = { path = "../skep-discovery" }

[dev-dependencies]
# The test world (the composition contract's assembler role, in miniature)
# derives Serialize/Deserialize for M2's WorldState bound.
serde.workspace = true
# A journaled kernel for the attestation test: the in-memory kernel keeps no
# commit marker, so which commits carry a signature is observable only on
# disk.
tempfile.workspace = true
