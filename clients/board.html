<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skep board</title>
<style>
:root {
  --ground:#F4F6F7; --panel:#FFFFFF; --ink:#1C2B33; --mut:#5A6B73;
  --line:#D7DEE1; --acc:#0E5A73; --a0:#5A6B73; --a1:#0E5A73; --a2:#8A5A16;
  --a3:#5B3E8F; --rej:#A03A2E; --ok:#2E6B3F; --wbg:#E4EEF2;
}
@media (prefers-color-scheme: dark) { :root {
  --ground:#12181C; --panel:#1A2228; --ink:#DCE4E8; --mut:#8FA0A8;
  --line:#2C3840; --acc:#4FA3BF; --a0:#8FA0A8; --a1:#5FB0CC; --a2:#D0A05C;
  --a3:#A98BD8; --rej:#D97A6C; --ok:#7CBF8E; --wbg:#1F3038;
} }
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink);
  font:15px/1.5 "Iowan Old Style",Palatino,Georgia,serif; }
header { position:sticky; top:0; z-index:5; background:var(--ground);
  border-bottom:1px solid var(--line); padding:.6rem 1rem;
  display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
h1 { font-size:1.05rem; margin:0; }
h1 small { color:var(--mut); font-weight:400; }
.stat { font:12px ui-monospace,Menlo,monospace; color:var(--mut); }
.stat b { color:var(--ink); font-variant-numeric:tabular-nums; }
#conn { font:600 11px system-ui,sans-serif; letter-spacing:.06em;
  text-transform:uppercase; padding:.15rem .5rem; border-radius:3px; }
#conn.up { color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, transparent); }
#conn.down { color:var(--rej); background:color-mix(in srgb, var(--rej) 14%, transparent); }
#urlbox { font:12px ui-monospace,Menlo,monospace; padding:.2rem .4rem;
  border:1px solid var(--line); border-radius:3px; background:var(--panel);
  color:var(--ink); width:15rem; }
.scrub { display:flex; align-items:center; gap:.6rem; flex:1;
  min-width:16rem; }
#slider { flex:1; accent-color:var(--acc); }
#poslabel { font:12px ui-monospace,Menlo,monospace; min-width:9rem;
  color:var(--mut); }
#livebtn { font:600 11px system-ui,sans-serif; letter-spacing:.06em;
  text-transform:uppercase; padding:.2rem .55rem; border-radius:3px;
  border:1px solid var(--acc); background:none; color:var(--acc);
  cursor:pointer; }
#livebtn.live { background:var(--acc); color:var(--ground); }
#livebtn:focus-visible, #urlbox:focus-visible, #slider:focus-visible,
summary:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
main { max-width:1060px; margin:0 auto; padding:1rem;
  display:grid; grid-template-columns: 1fr 21rem; gap:1rem; }
@media (max-width: 900px) { main { grid-template-columns:1fr; } }
h2 { font-size:.95rem; margin:1rem 0 .4rem; }
.doc { background:var(--panel); border:1px solid var(--line);
  border-radius:4px; margin:.5rem 0; }
.doc > summary { padding:.4rem .7rem; cursor:pointer;
  font:600 12.5px system-ui,sans-serif; display:flex; gap:.6rem;
  align-items:baseline; }
.doc summary code { font:12px ui-monospace,Menlo,monospace; color:var(--acc); }
.owner { font-weight:700; }
.o0 { color:var(--a0); } .o1 { color:var(--a1); }
.o2 { color:var(--a2); } .o3 { color:var(--a3); }
.doc .meta { color:var(--mut); font-weight:400; margin-left:auto;
  font:11px ui-monospace,Menlo,monospace; }
.text { padding:.2rem .8rem .7rem; white-space:pre-wrap;
  font:12.5px/1.55 ui-monospace,Menlo,monospace; overflow-x:auto; }
.text .ref { color:var(--acc); }
.text .atom { color:var(--a2); }
.flash { animation:flash 1.2s ease-out; }
@keyframes flash { from { background:var(--wbg); } to { background:transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation:none; } }
.link { background:var(--panel); border:1px solid var(--line);
  border-radius:4px; margin:.4rem 0; padding:.45rem .6rem;
  font:11.5px/1.5 ui-monospace,Menlo,monospace; }
.link .addr { color:var(--acc); }
.jump { color:var(--acc); text-decoration:underline dotted; cursor:pointer;
  background:none; border:none; font:inherit; padding:0; }
.jump:hover { text-decoration:underline; }
.span-chip { color:var(--mut); }
.slot .gloss { color:var(--ink); }
.sysclass { color:var(--a3); font-weight:600; }
.slot b { display:inline-block; width:3.2em; color:var(--mut);
  font-weight:600; }
.ticker { background:var(--panel); border:1px solid var(--line);
  border-radius:4px; max-height:20rem; overflow:auto;
  font:11.5px/1.5 ui-monospace,Menlo,monospace; }
.tick { padding:.2rem .6rem; border-bottom:1px solid var(--line); }
.tick:last-child { border-bottom:none; }
.tick .t { color:var(--mut); }
.err { color:var(--rej); padding:.4rem .8rem;
  font:12px system-ui,sans-serif; }
.mut { color:var(--mut); }
</style>
</head>
<body>
<header>
  <h1>skep board <small>live view</small></h1>
  <span id="conn" class="down">connecting</span>
  <span class="stat">head <b id="head">–</b></span>
  <span class="stat"><b id="ndocs">–</b> docs</span>
  <span class="stat"><b id="nlinks">–</b> links</span>
  <div class="scrub">
    <input id="slider" type="range" min="0" max="0" value="0"
           aria-label="history position">
    <span id="poslabel">–</span>
    <button id="livebtn" class="live">live</button>
  </div>
  <input id="urlbox" value="http://127.0.0.1:8642" aria-label="skepd url">
</header>
<main>
  <section>
    <h2>Documents</h2>
    <div id="docs"><div class="mut">waiting for daemon…</div></div>
  </section>
  <aside>
    <h2>Links</h2>
    <div id="links"></div>
    <h2>Changes</h2>
    <div class="ticker" id="ticker"></div>
  </aside>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let BASE = localStorage.getItem("skepd_url") || "http://127.0.0.1:8642";
$("urlbox").value = BASE;

let head = 0;          // committed head per /events (or /health)
let scrubPos = null;   // null = live; number = historical position
let es = null;         // EventSource
let refreshTimer = null;
let lastTexts = new Map();   // addr -> text (for the change ticker, live mode)
let openDocs = new Set();    // which <details> the user has open

// ---- wire helpers ----------------------------------------------------------
async function post(path, body) {
  const r = await fetch(BASE + path, { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  const doc = await r.json();
  if (!r.ok) throw Object.assign(new Error(doc.error || r.status), doc);
  return doc;
}
async function op(frame) {
  if (scrubPos === null) return post("/op", frame);
  try { return await post("/op-at", { at: scrubPos, frame }); }
  catch (e) {
    if (e.error === "not_a_position" && e.nearest !== undefined) {
      scrubPos = e.nearest; syncScrubUI();
      return post("/op-at", { at: scrubPos, frame });
    }
    throw e;
  }
}
async function health() {
  const r = await fetch(BASE + "/health");
  return r.json();
}

// ---- rendering helpers -----------------------------------------------------
function esc(s) { const d = document.createElement("span");
  d.textContent = s; return d.innerHTML; }
function renderItems(items) {
  return items.map(i =>
    "content" in i ? esc(i.content) :
    "ref" in i ? `<span class="ref">[link@${esc(i.ref)}]</span>` :
    "atom" in i ? `<span class="atom">⟨atom:${esc(i.atom)}⟩</span>` :
    "atom_hex" in i ? `<span class="atom">⟨atom_hex:${esc(i.atom_hex)}⟩</span>` :
    "hex" in i ? `<span class="atom">⟨hex:${esc(i.hex)}⟩</span>` : ""
  ).join("");
}
function parentDoc(addr) { return addr.split(".").slice(0, -3).join("."); }
function clip(s, n) { return s.length > n ? s.slice(0, n) + "…" : s; }

// ---- board reading (namespace walk, same as analysis/board.py) -------------
async function principals() {
  const out = {};
  for (let p = 0; p < 120; p++) {
    const r = await op({ op: "principal_prefix", principal: p });
    if (r.resp === "maybe_addr" && r.addr) out[p] = r.addr;
  }
  return out;
}
async function docText(doc) {
  const ss = await op({ op: "retrieve_doc_v_span_set", doc });
  if (ss.resp !== "span_set") return null;
  let html = "", plain = "";
  for (const span of ss.set) {
    const dv = await op({ op: "retrieve_v", specs: [{ doc, span }] });
    if (dv.resp !== "delivery") { html += `⟨${esc(dv.code || "?")}⟩`; continue; }
    html += renderItems(dv.items);
    plain += dv.items.map(i => i.content ?? i.atom ?? "").join("");
  }
  return { html, plain, runs: ss.set.length };
}
function ownerOf(doc, accts) {
  let best = null, bp = null;
  for (const [p, a] of Object.entries(accts))
    if ((doc === a || doc.startsWith(a + ".")) && (!best || a.length > best.length))
      { best = a; bp = p; }
  return bp;
}
function shortWidth(w) {
  const parts = w.split(".");
  return parts[parts.length - 1];
}
function docJump(addr) {
  return `<button class="jump" data-doc="${esc(addr)}">${esc(addr)}</button>`;
}
const RESERVED = {
  "9.0.9.0.9.0.9.1": "pred_def", "9.0.9.0.9.0.9.2": "pred_stable",
  "9.0.9.0.9.0.9.3": "retired", "9.0.9.0.9.0.9.4": "supersedes",
  "9.0.9.0.9.0.9.5": "retraction",
};
async function spanParts(link, slot) {
  // -> [{isp, src, text}] for each endset span, text may be ""
  const f = await op({ op: "follow_link", a: link, slot });
  const res = f.result || {};
  if (res.err || !res.ok) return null;
  const out = [];
  for (const isp of res.ok) {
    const src = parentDoc(isp.start);
    let txt = "";
    if (!RESERVED[isp.start]) {
      const pr = await op({ op: "project", a: link, slot, d: src });
      if (pr.resp === "span_set" && pr.set.length)
        for (const span of pr.set) {
          const dv = await op({ op: "retrieve_v", specs: [{ doc: src, span }] });
          if (dv.resp === "delivery")
            txt += dv.items.map(i => i.content ?? "").join("");
        }
    }
    out.push({ isp, src, txt: txt.trim() });
  }
  return out;
}
async function slotText(link, slot) {
  const parts = await spanParts(link, slot);
  if (parts === null) return "(invalid)";
  if (!parts.length) return "(empty)";
  return parts.map(({ isp, src, txt }) => {
    if (RESERVED[isp.start])
      return `<span class="sysclass">⟦${RESERVED[isp.start]}⟧</span>`;
    const chip = `<span class="span-chip">⟨${docJump(src)} ` +
      `@${esc(isp.start)} w=${esc(shortWidth(isp.width))}⟩</span>`;
    const gloss = txt ?
      `<span class="gloss">“${esc(clip(txt, 60))}”</span>` : "";
    // TYPE is content-defined: its meaning IS the covered text — words
    // lead, identity annotates. FROM/TO are references — tumblers lead.
    if (slot === 3 && gloss) return `${gloss} ${chip}`;
    return gloss ? `${chip} ${gloss}` : chip;
  }).join(" ");
}

// ---- the refresh -----------------------------------------------------------
let refreshing = false, refreshQueued = false;
async function refresh() {
  if (refreshing) { refreshQueued = true; return; }
  refreshing = true;
  try {
    const accts = await principals();
    // documents
    const docsEl = $("docs");
    const frag = document.createDocumentFragment();
    let ndocs = 0;
    const nowTexts = new Map();
    for (const [p, acct] of Object.entries(accts)) {
      let misses = 0, n = 1;
      while (misses <= 2) {
        const d = `${acct}.0.${n}`; n++;
        const t = await docText(d);
        if (t === null) { misses++; continue; }
        misses = 0; ndocs++;
        nowTexts.set(d, t.plain);
        const det = document.createElement("details");
        det.className = "doc";
        det.id = "doc-" + d;
        det.open = openDocs.size ? openDocs.has(d) : Number(p) !== 99;
        det.addEventListener("toggle", () => {
          if (det.open) openDocs.add(d); else openDocs.delete(d); });
        const changed = scrubPos === null && lastTexts.size &&
                        lastTexts.get(d) !== t.plain;
        det.innerHTML =
          `<summary><code>${esc(d)}</code>` +
          `<span class="owner o${Number(p) % 4}">p${esc(p)}</span>` +
          `<span class="meta">${t.plain.length} ch · ${t.runs} run(s)</span>` +
          `</summary><div class="text${changed ? " flash" : ""}">` +
          (t.html || '<span class="mut">(empty)</span>') + `</div>`;
        frag.appendChild(det);
        if (changed) tick(d, lastTexts.get(d), t.plain);
      }
    }
    docsEl.replaceChildren(frag);
    if (scrubPos === null) lastTexts = nowTexts;
    $("ndocs").textContent = ndocs;

    // links
    const q = { from: "any", home: "any", to: "any", ty: "any" };
    const count = await op({ op: "count_ftt", q });
    $("nlinks").textContent = count.n ?? "?";
    const linksEl = $("links");
    const lfrag = document.createDocumentFragment();
    let cur = null, seen = 0;
    while (seen < (count.n ?? 0)) {
      const page = await op({ op: "window_ftt", q, cur, n: 32 });
      if (page.resp !== "page") break;
      for (const a of page.window.batch) {
        seen++;
        const div = document.createElement("div");
        div.className = "link";
        const home = parentDoc(a);
        div.innerHTML = `<div><span class="addr">${esc(a)}</span> ` +
          `<span class="mut">home ${docJump(home)}</span></div>` +
          `<div class="slot"><b>FROM</b> …</div>` +
          `<div class="slot"><b>TO</b> …</div>` +
          `<div class="slot"><b>TYPE</b> …</div>`;
        lfrag.appendChild(div);
        (async () => {
          const slots = div.querySelectorAll(".slot");
          for (let s = 1; s <= 3; s++)
            slots[s - 1].innerHTML =
              `<b>${["FROM","TO","TYPE"][s-1]}</b> ` + await slotText(a, s);
        })();
      }
      if (page.window.exhausted) break;
      cur = page.window.next;
    }
    linksEl.replaceChildren(lfrag);
    setConn(true);
  } catch (e) {
    setConn(false, String(e.message || e));
  } finally {
    refreshing = false;
    if (refreshQueued) { refreshQueued = false; scheduleRefresh(); }
  }
}
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, 250);
}

// ---- ticker ----------------------------------------------------------------
function tick(doc, oldT, newT) {
  const line = document.createElement("div");
  line.className = "tick";
  const time = new Date().toTimeString().slice(0, 8);
  let msg;
  if (oldT !== undefined && newT.startsWith(oldT))
    msg = `${doc} += “${clip(newT.slice(oldT.length), 90)}”`;
  else if (oldT === undefined) msg = `NEW ${doc}`;
  else msg = `${doc} edited`;
  line.innerHTML = `<span class="t">${time}</span> ${esc(msg)}`;
  $("ticker").prepend(line);
  while ($("ticker").children.length > 120) $("ticker").lastChild.remove();
}

// ---- history scrubber ------------------------------------------------------
function syncScrubUI() {
  const live = scrubPos === null;
  $("livebtn").classList.toggle("live", live);
  $("slider").value = live ? head : scrubPos;
  $("poslabel").textContent = live ? `@ ${head} (live)` : `@ ${scrubPos}`;
}
$("slider").addEventListener("input", () => {
  scrubPos = Number($("slider").value);
  if (scrubPos >= head) scrubPos = null;
  syncScrubUI(); scheduleRefresh();
});
$("livebtn").addEventListener("click", () => {
  scrubPos = null; syncScrubUI(); scheduleRefresh();
});

// ---- connection ------------------------------------------------------------
function setConn(up, msg) {
  const el = $("conn");
  el.className = up ? "up" : "down";
  el.textContent = up ? "connected" : (msg ? "down — " + clip(msg, 40) : "down");
}
function connect() {
  if (es) es.close();
  es = new EventSource(BASE + "/events");
  es.addEventListener("commit", ev => {
    try { head = JSON.parse(ev.data).log_position; } catch { return; }
    $("head").textContent = head;
    $("slider").max = head;
    if (scrubPos === null) { syncScrubUI(); scheduleRefresh(); }
  });
  es.onopen = () => setConn(true);
  es.onerror = () => setConn(false);
}
$("urlbox").addEventListener("change", () => {
  BASE = $("urlbox").value.replace(/\/+$/, "");
  localStorage.setItem("skepd_url", BASE);
  lastTexts = new Map(); openDocs = new Set();
  connect(); scheduleRefresh();
});

document.addEventListener("click", ev => {
  const b = ev.target.closest(".jump");
  if (!b) return;
  const det = document.getElementById("doc-" + b.dataset.doc);
  if (!det) return;
  det.open = true; openDocs.add(b.dataset.doc);
  det.scrollIntoView({ behavior: "smooth", block: "start" });
  const tx = det.querySelector(".text");
  if (tx) { tx.classList.remove("flash"); void tx.offsetWidth;
            tx.classList.add("flash"); }
});

health().then(h => { head = h.log_position; $("head").textContent = head;
  $("slider").max = head; syncScrubUI(); }).catch(() => {});
connect();
scheduleRefresh();
</script>
</body>
</html>
