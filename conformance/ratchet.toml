# skep conformance ratchet — frozen 2026-08-15 after six adjudicated runs.
# The gate FAILS on: any scenario verdict worse than listed here, any
# `divergent` or `error` verdict at all, or a listed scenario missing.
# Shrinking this file (scenario becomes pass) is free — trim it.
# Growing [allowlisted] or [inexpressible] requires a ruling in
# adjudication/decisions.md, by a human.
# Each scenario is named by its key, "<category>/<name>" — its golden's
# directory and name; two goldens can share a name.
# [pending] lists scenarios not yet adjudicated — corpus extensions, and
# scenarios a change newly finds diverging, each recorded (not ruled) in
# adjudication/decisions.md: exempt from enforcement, reported loudly, to
# be dispositioned into the sections above (or to pass) by the next
# adjudication cycle.

