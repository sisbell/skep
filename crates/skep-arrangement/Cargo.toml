[package]
name = "skep-arrangement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M5 — Arrangements & Editing (Vstream): the per-document mutable V→I arrangement (POOM) plus the append-only content-provenance relation R; editing/versioning operations and the publish shot with its admission query, the version-chain reads (head-float, the deposit surface and the birth version), link seating for M7, forward/reverse arrangement reads, the R reads, the birth-extent and shot-terms reads, and the shot's address form"
readme = "README.md"

[features]
# `test-hooks` compiles in one test-only item: `seat_link`, the standalone
# transact-wrapped twin of `stage_seat_link` the composition contract asks
# for. It applies no ownership gate and seats with no link allocation, so
# production seats through M7's MAKELINK and never through it. DEFAULT-OFF:
# this crate's tests turn it on through the self dev-dependency below,
# skep-retrieval's on their own line, so a build that compiles no test
# compiles none of it.
test-hooks = []

[dependencies]
# The design's mandated slice shapes (§Core data model): persistent im
# collections for the four fields of M5's slice — arrangements keyed by the
# document Address (im::OrdMap), the provenance relation (im::OrdMap of
# im::Vector<Span>, behind the Provenance type that keeps it append-only,
# keyed the same way), the birth extents the fold derives
# (im::OrdMap<Address, Nat>, keyed by each trunk's birth version), and the
# shot terms the shot journals (im::OrdMap<Address, ShotTerms>, keyed by each
# member it mints) — plus the RunList's v1 physical backing im::Vector<Run>
# (Open build decision #1 default). The serde feature because all four fields
# are fully serialized in checkpoints (no skip-serialize; rebuild_derived is
# identity): im's `Serialize` writes them, and their decode is this crate's
# own (src/decode.rs), entry by entry, since im's visitor reserves room for
# the count a checkpoint body declares.
im.workspace = true
# Nat::zero()/one()/is_zero() are trait fns the ordinal math keeps in scope.
num-traits.workspace = true
serde.workspace = true
# M1 — tumbler/address/span algebra; M5 holds no address algebra of its own.
skep-address = { path = "../skep-address" }
# M2 — every composite rides transact/snapshot; M5 owns no ordering,
# durability, or recovery.
skep-kernel = { path = "../skep-kernel" }
# M3 — registration, ownership, publication and version-frontier reads (the
# last two through chain.rs), the pure mints composed into M5's composites,
# first_version_address (where a trunk's chain opens — its birth version, the
# key of the birth extents — asked through chain.rs too),
# ghost_home_document (where the deposit class's types sit),
# and the *_lock_key constructors (the workspace's one source of
# Space::Namespace-tagged key bytes — see the serialization-key note in lib.rs).
skep-namespace = { path = "../skep-namespace" }
# M4 — stage_write (the storage half of K.α, composed into INSERT and the
# shot's re-insert through allocate_for_placement), contains (COPY's
# content-side S3★ gate on run starts) and value_at (the shot's existence
# check and the bytes it re-inserts). M5 → M4, no back-edge.
skep-content = { path = "../skep-content" }

[dev-dependencies]
# This crate itself with `test-hooks` on, so its integration tests
# (tests/it, outside this library's `cfg(test)`) compile against `seat_link`
# under a plain `cargo test` or workspace run, no flag added. A build that
# compiles no test never reads this table.
skep-arrangement = { path = ".", features = ["test-hooks"] }
# bincode is M2's actual wire format — the round-trip tests exercise the real
# journal/checkpoint encoding; tempfile hosts the durable-recovery test.
bincode.workspace = true
tempfile.workspace = true
