[package]
name = "skep-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Conformance harness: plays the vendored udanax-green golden scenarios against skep's real Operation<World>::execute surface and reports, scenario by scenario, where the two systems agree and where they diverge. The harness never negotiates with the goldens and never negotiates with skep."

[dependencies]
# The assembled engine (the one concrete World) and the operation surface we
# drive — library path only: no binary, no network.
skep-engine = { path = "../skep-engine" }
skep-febe = { path = "../skep-febe" }
# Argument/result types named by Op/Response.
skep-address = { path = "../skep-address" }
skep-kernel = { path = "../skep-kernel" }
skep-namespace = { path = "../skep-namespace" }
skep-content = { path = "../skep-content" }
skep-arrangement = { path = "../skep-arrangement" }
skep-retrieval = { path = "../skep-retrieval" }
skep-links = { path = "../skep-links" }
skep-discovery = { path = "../skep-discovery" }
# Golden scenario files are loose field-bags — parsed as dynamic JSON.
serde_json.workspace = true
