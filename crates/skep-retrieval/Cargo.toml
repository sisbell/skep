[package]
name = "skep-retrieval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M6 — Content Retrieval & Query: the read-only observer surface over documents — RETRIEVEV, document-extent queries, SHOWORIGIN (V-arity), SHOWDELETIONS, COMPARE, FINDDOCSCONTAINING — each a pure function of one pinned M2 snapshot"
readme = "README.md"

[dependencies]
# Nat::zero()/one()/is_zero()/checked_sub() are trait fns the ordinal math
# keeps in scope.
num-traits.workspace = true
serde.workspace = true
# M1 — origin projection (document_of), the subspace numerals
# (content_subspace/link_subspace), gate primitives (action_point/zeros/
# is_level_uniform/ordinal), span/span-set synthesis and membership, and the
# Address/Tumbler orders the answer presentation sorts by.
skep-address = { path = "../skep-address" }
# M2 — the pinned Snapshot every query binds, and its Seq. M6 never writes:
# no transact, no Kernel handle, no LockKey.
skep-kernel = { path = "../skep-kernel" }
# M3 — is_registered_document, the universal registry gate (registered-empty
# vs not registered is M6's owned distinction).
skep-namespace = { path = "../skep-namespace" }
# M4 — value_at, plus Val as DeliveryItem's leaf. `HasContent` is the bound of
# RETRIEVEV's own impl block and of nothing else, so M4 is reachable from
# exactly one operation and unspellable in the other six.
skep-content = { path = "../skep-content" }
# M5 — the workhorse: resolve/point/counts/runs/image/project/
# docs_ever_containing/deletions; Run, which answers for its own positions; and
# VPos (re-exported through M6's surface).
skep-arrangement = { path = "../skep-arrangement" }

[dev-dependencies]
# bincode is M2's actual wire format — the marshaling-policy tests serialize
# M6's Serialize-only result/error types with it (M6 journals nothing, so
# there is no round trip to test: no Deserialize anywhere by design).
bincode.workspace = true
