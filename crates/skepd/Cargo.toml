[package]
name = "skepd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The skep daemon: one long-running process owning one World, serving the full M10 operation surface over HTTP/JSON to local clients. Transport, sessions, configuration, and process lifetime — no semantics but the three the spec gives it, two of them its core's (skep-core): the session layer's gates, the published head's cadence and the media door."
readme = "README.md"

[features]
# `observe` forwards the engine's WorldDump surface as GET /dump. Default-ON
# so the workspace gate exercises the route and the restart test's dump
# equality; a build without it simply has no /dump route.
default = ["observe"]
observe = ["skep-engine/dump"]
# `client` embeds skep/clients/board.html (include_str! at build — the
# binary is self-contained) and serves it at GET /. The page is the GUEST
# READER: one self-contained file that reads the board and holds no key,
# token or session — the read-only guest view R89 (THE CLIENT RULE, MUST)
# permits a board to serve, and never one that acts. DEFAULT-OFF all the
# same: a hosted image should serve no page unless the operator chose to,
# so the hosted image simply does not opt in and ABSTENTION IS ENOUGH —
# forgetting the flag there yields a board with no page, and forgetting
# it on a notebook build yields no UI at all, which announces itself the
# moment anyone opens it. Packaged notebook builds enable it. A build
# without it has no / route (the usual 404 shape).
# scripts/gate-full.sh compiles skepd with it on and reruns the tests whose
# answers turn on it, so the route stays exercised.
client = []
# `test-hooks` compiles in the test-only code: `Daemon`'s `#[doc(hidden)]`
# hooks (server/hooks.rs) and the claim-flip hold one of them arms, the
# `fuzz_support` harness, and the `Permit` re-export the pool hooks return —
# and turns on FOUR things in other crates, a chain: `skep-core`'s own
# `test-hooks`, the seam the daemon's hooks on its core call (the feed
# walk's hold, notice and panic arm, the head writer's clock and its one
# refusal, the feed's and the attest store's failure arms and the attest
# store's sync mark, the walk's pending region and progress cadence, the
# lines said, the checkpoint signal's tick), which forwards nothing;
# `skep-media`'s own `test-hooks`, the seam the daemon's media hooks call
# (the walk hold, the stream hold, the prune hold, the gate's clock,
# free-space and limits overrides, the index's report and counts, the
# pools' `try_hold`); `skep-blobs`'s hazard seam — the hold at a named step
# of a finish that this crate's own blob-store hold
# (`Daemon::hold_blob_finish_at`, media lane B) is a door to, reached
# through the media crate's gate; the media crate forwards the latter too;
# and `skep-kernel`'s write-fault seam (its `src/hooks.rs`) — the next
# checkpoint write, before or past its rename, or the next journal append,
# barrier or repair failing with a named `io::ErrorKind`, or a panic in the
# checkpoint write — reached through the kernel's own `#[doc(hidden)]`
# doors on the engine's kernel. `skep-signature`'s signer and fixture hooks
# reach this crate's tests through their own dev-dependency line below, and
# a consumer that signs names the feature it needs on its own
# `skep-signature` line. DEFAULT-OFF, and the shipped binary never enables
# it: this crate's own tests turn it on through the self dev-dependency
# below, and skep-mcp's tests and skep/fuzz/ on their `skepd` lines, so a
# build that compiles no test compiles none of it.
test-hooks = ["skep-blobs/test-hooks", "skep-kernel/test-hooks", "skep-media/test-hooks", "skep-core/test-hooks"]

[dependencies]
# THE DAEMON's CORE, the crate below this one: the session layer (who may
# act — the origin sets, the handshake, the sessions, the credential lock
# and the refusal producers it scopes, the signed-ops check), the commits
# (the one door every write rides, the record, the feed, the published
# head — opened and driven from `server.rs`), the wire codec, the two
# bounds this daemon reads from its `limits` and the serialization lock
# the routes hold across the door. Its `README.md` lists the surface; this
# crate's root re-exports the six session-layer names and the codec on its
# own surface, so no caller depends on the core for them.
skep-core = { path = "../skep-core" }
# The assembled engine: Engine::open (genesis-or-recover), the Stores<World>
# factory, and (behind `observe`) the WorldDump surface.
skep-engine = { path = "../skep-engine", default-features = false }
# M10 — the operation surface this daemon transports: OperationSurface, Op/Response,
# the Codec seam, and the typed Rejection model.
skep-febe = { path = "../skep-febe" }
# M2 — KernelConfig/Durability/CheckpointPolicy (durability is configuration,
# chosen here) and Seq.
skep-kernel = { path = "../skep-kernel" }
# The wire value types the routes, the tools and the history service name
# — addresses and principals; the codec's round trips over every value type
# are the core's.
skep-address = { path = "../skep-address" }
skep-namespace = { path = "../skep-namespace" }
skep-discovery = { path = "../skep-discovery" }
# The AUTH identity vocabulary's two reads the routes make themselves:
# `HasIdentity`, the World's identity slice off the snapshot a route holds,
# and `IdentityState`, what the open and the claim flip hand the session
# layer. The credential data model, the key sets and the classify oracle
# are the core's uses; the fold itself is the engine's (AUTH-2.79).
skep-identity = { path = "../skep-identity" }
# `SeedingRefusal`, the refusal `DaemonError::Registry` carries and the
# root re-exports: the registry's rows, bodies and seeding check are the
# core's uses (`auth/policy/registry.rs`), the check run by this daemon's
# open ahead of every genesis.
skep-registry = { path = "../skep-registry" }
# THE BLOB STORE (media lane B): the files, the partials, the upload records
# and the lease log under `blobs/` in the data dir — the PUT's fsync order
# and the lease's honest-null answer. It knows no principal, lock or limits
# record; `skep-media`'s gate is what reads those. Named here for what the
# daemon drives through that gate's store — an upload's acts by the gate's
# key, the hooks' hazard seam (`skep_blobs::Step`) — and for the operator's
# tools, whose inspection and install open it with no gate at all.
skep-blobs = { path = "../skep-blobs" }
# THE MEDIA RESOURCE (media lanes A and B), a crate of its own beside the
# write path: the cell's one parser, the media door the plain sequence
# runs, the gate over `skep-blobs` — the limits in force, the hold, the
# scopes, the binding — the cell index and its walk at open, the pruner's
# pass, the fetch's composed order, and the four limits this daemon reads
# too. Generic over the world; this daemon instantiates it at `World`.
skep-media = { path = "../skep-media" }
# THE SUPPORT CRATE below this one and the media crate — the three utilities
# both take and neither owns: the counting permit pool the four bounded
# pools are built on (one `Permit` type, the one the pool hooks return), the
# operator's notice line, and the codec's determinism helpers — the
# key-sorting `obj` every JSON object goes through, lowercase hex and its
# exact inverse. It depends on nothing of skep.
skep-util = { path = "../skep-util" }
# JSON frames and the daemon's own objects (`/health`, the replies), built
# through `skep-util`'s key-sorting `obj` as the core's codec builds its,
# so marshal determinism never depends on serde_json's map backend.
serde_json.workspace = true
# No HTTP server dependency, deliberately (wire v4): the daemon speaks a
# written-out HTTP/1.1 subset over std's TcpListener; server.rs's module doc
# carries why a pull-based server library cannot serve the commit stream.
# No async runtime either: M2's single applier already serializes writes and
# OperationSurface::execute is Sync, so worker threads are the whole concurrency
# story.
#
# Non-poisoning locks, used for EVERY lock this crate holds (the same
# totality argument M10 §7 makes): a panic under one releases it with the
# data as it stands, which is what serve_connection's unwind note rests on.
# Deliberately no inventory here — a list in a manifest goes stale in silence
# while the argument does not.
parking_lot.workspace = true
# THE RESET CLOSE of a blob fetch stream (server/http.rs): `SO_LINGER` at
# zero on the one socket option std does not expose, so a stream the
# mid-stream re-check ends sends a reset and never a clean finish a client
# could read as the whole file. The `net` feature alone.
rustix = { version = "1", features = ["net"] }
# THE RESIDENT SET on the checkpoint thread's landing line (server.rs,
# `service_the_checkpoint`): the process's physical memory — the resident
# set size on macOS and Linux — read once per landing and once per backstop
# wake, on that thread, and kept as THE DAEMON's OWN HIGH-WATER, the
# largest reading it has taken this uptime, which is the figure the line
# carries as "the process's resident set peaked at"; NOT the kernel's
# `ru_maxrss`, which the two differ from by whatever rose and fell between
# two readings. Ruled in for this one figure: the `rustix` above has no
# `getrusage` at 1.1.x, `/proc` is Linux's alone, and a `libc` call is the
# `unsafe` FFI `lib.rs`'s `#![forbid(unsafe_code)]` refuses — the `unsafe`
# lives inside this crate, as rustix's does. No other use, nothing of it on
# `/health`, and its optional `serde` left off.
memory-stats = "1.2"
# BLAKE3 at the operator's tools (tools.rs): the inventory's re-hash of a
# referenced file and the pull's hash of the file it installs, each held to
# the hex a cell names — the designation the store deposits under. The
# fetch's own check of a whole file against its cell went to `skep-media`
# with the serve; the suites hash with it too, judging the daemon's answer
# against their own (Q-sm2).
blake3.workspace = true

[dev-dependencies]
# This crate itself with `test-hooks` on, so its integration tests
# (tests/it, outside this library's `cfg(test)`) compile against the hooks
# under a plain `cargo test` or workspace run, no flag added. A build that
# compiles no test never reads this table, so the binary stays without them.
# `default-features = false`, so this line adds `test-hooks` and nothing
# else: with the implicit default it would switch `observe` back on in every
# test build, and the gate's `--no-default-features` check would compile the
# tests with the dump route after all.
skepd = { path = ".", features = ["test-hooks"], default-features = false }
tempfile.workspace = true
# The blob store with its hazard seam named, so the SIGKILL harness can name
# the step it holds a finish at (`skep_blobs::Step`). BLAKE3 the suites hash
# with is the dependency above.
skep-blobs = { path = "../skep-blobs", features = ["test-hooks"] }
# The TEST SIGNER and its fixture hooks (the daemon itself only verifies):
# the suites' fixed seeds are its `Seed`, no key themselves — the 32 bytes
# that seed each hybrid key (`common::seed_of`) through
# `HybridSigner::from_seed`, which signs sessions and entries; the seeded
# stream and the Ed25519 half (`Ed25519SigningKey`) come through the hooks,
# and the half's own `sign` makes the one bare Ed25519 signature the suites
# send as a negative vector; `key_decodes`, the precheck's own decode, finds
# the non-point an undecodable key carries. `skep-signature` is the one crate
# that links the signature libraries, so no suite names `ed25519-dalek`.
skep-signature = { path = "../skep-signature", features = ["test-hooks"] }
# H4 property-based op sequences (tests/it/properties.rs): random-but-valid
# plans with shrinking; failure seeds persist to proptest-regressions/
# (pins, same standing as goldens).
proptest.workspace = true
# THE VERIFYING RESOLVER, taken as the library it is (tests/it/resolve.rs):
# the end-to-end cells and the measurements run here, where boards are
# spawned and registered. The daemon itself never depends on it.
skep-resolve = { path = "../skep-resolve" }
# The content, arrangement, retrieval and link value types the suites build
# their fixtures and read their answers with; the daemon's own sources name
# none of them (the codec that round-trips them is the core's).
skep-content = { path = "../skep-content" }
skep-arrangement = { path = "../skep-arrangement" }
skep-retrieval = { path = "../skep-retrieval" }
skep-links = { path = "../skep-links" }
