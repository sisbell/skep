[package]
name = "skep-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The MCP adapter: JSON-RPC 2.0 over stdio on the agent side, skepd's HTTP/JSON wire on the other. One static binary an operator points a harness at; tool name → wire op is mechanical, skepd documents pass through verbatim, rejections are data."
readme = "README.md"

[dependencies]
# Both protocols are small enough to own — a written-out HTTP/1.1 client
# over std::net (skepd is one-request-per-connection, Connection: close),
# and newline-delimited JSON-RPC over stdio. JSON framing is the one thing
# taken from a library.
serde_json.workspace = true

[dev-dependencies]
# The real stack: tests build a daemon in-process on an ephemeral port over
# a temp data dir, claim its board over the wire (an unclaimed daemon runs
# nothing but the claim ceremony — RES-27), provision a principal, and
# drive the built skep-mcp binary through its stdin/stdout.
skepd = { path = "../skepd" }
# The ceremony's record grammar and session-payload framing.
skep-identity = { path = "../skep-identity" }
# Test-side signing for the ceremony's claim step (the daemon only verifies).
ed25519-dalek = "2"
