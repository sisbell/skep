[package]
name = "skep-coordination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M9 — Predicate & Coordination Layer: the closed statically-typed predicate/query algebra (PL) over M7/M3 structural state, predicate definitions persisted as content (pdef/pd_stable), and the reactive rule engine with quiescence detection, fair stepping, and the termination lint"
readme = "README.md"

[dependencies]
# Value's persistent sets/maps (AddrSet/AddrSeq/Map, the Env) and cheap
# intermediate values during folds — never journaled snapshots (§Core data
# model: M9 owns no authoritative state).
im.workspace = true
# M1 — tumbler/address/span algebra: the T1 order (`Address: Ord`, the order
# PL's address sets keep) and is_prefix behind V-PRIM's ≼/</T1 extrema;
# validate for the lift of a slot's denoted tumbler to a PL address
# (`value::lift`) and for the def codec's parse; document_of for the
# guest-class home test and the fire attribution key.
skep-address = { path = "../skep-address" }
# M2 — every verdict reads one pinned Snapshot; every write rides M5's/M7's
# transact-wrapped ops (M9 drives no transact directly).
skep-kernel = { path = "../skep-kernel" }
# M3 — is_registered_document is PL's is_doc and the emit home-gate.
skep-namespace = { path = "../skep-namespace" }
# M4 — value_at(start) for resolve/parse of stored defs (the only content
# read; lives in the operation-surface pass, never the denotation).
skep-content = { path = "../skep-content" }
# M5 — Vstream::insert writes def content through the placement composite
# (J0); content_count and VPos::content for the append position.
skep-arrangement = { path = "../skep-arrangement" }
# M7 — the link store, read off `LinkState`: `observe` (the one slice
# `GuestLinks` rebuilds every PL read over at guest class, and the class-free
# reads' — the def probes and the divergence monitor), `is_k`, BH4's
# `age`/`stale`, `tip` for a def's lineage head and `readlink` for a fire's
# gap accounting; the `TypeRegistry` the catalog projects once; the gated
# writes (`emit`/`nullify`) through the injected `LinkWriter`; and the
# vocabulary PL's type keys and values are spelled in (`Endset`,
# `CoverageClass`, `Tuple`), which the crate root re-exports.
skep-links = { path = "../skep-links" }

[dev-dependencies]
# The test world (the composition contract's assembler role, in miniature)
# derives Serialize/Deserialize for M2's WorldState bound.
serde.workspace = true
