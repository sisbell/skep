[package]
name = "skep-arrangement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M5 — Arrangements & Editing (Vstream): the per-document mutable V→I arrangement (POOM) plus the append-only content-provenance relation R; editing/versioning operations, link seating for M7, forward/reverse arrangement reads, and the R read surface"
readme = "README.md"

[dependencies]
# The design's mandated slice shapes (§Core data model): persistent im
# collections for the two authoritative slices — arrangements keyed by Tumbler
# (im::OrdMap) and the provenance record (im::OrdMap of im::Vector<Span>,
# behind the Provenance type that keeps it append-only) — plus the
# RunList's v1 physical backing im::Vector<Run> (Open build decision #1
# default). The serde feature because both slices are fully serialized in
# checkpoints (no skip-serialize; rebuild_derived is identity).
im.workspace = true
# Nat::zero()/one()/is_zero() are trait fns the ordinal math keeps in scope.
num-traits.workspace = true
serde.workspace = true
# M1 — tumbler/address/span algebra; M5 holds no address algebra of its own.
skep-address = { path = "../skep-address" }
# M2 — every composite rides transact/snapshot; M5 owns no ordering,
# durability, or recovery.
skep-kernel = { path = "../skep-kernel" }
# M3 — registration/ownership reads, the pure mints composed into M5's
# composites, and the *_lock_key constructors (the workspace's one source of
# Space::Namespace-tagged key bytes — see the serialization-key note in lib.rs).
skep-namespace = { path = "../skep-namespace" }
# M4 — stage_write (the storage half of K.α, composed into INSERT) and
# contains (COPY's content-side S3★ referential gate). M5 → M4, no back-edge.
skep-content = { path = "../skep-content" }

[dev-dependencies]
# bincode is M2's actual wire format — the round-trip tests exercise the real
# journal/checkpoint encoding; tempfile hosts the durable-recovery test.
bincode.workspace = true
tempfile.workspace = true
