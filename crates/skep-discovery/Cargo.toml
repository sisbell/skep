[package]
name = "skep-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "M8 — Link Query & Discovery: the read-only query/presentation layer over the link subsystem — content-region discovery, four-set descriptor queries, counting, windowed pagination, projection, RETRIEVEENDSETS, delete-orphan previews, and supersession lineage — composed from M7/M5/M3 over one M2 snapshot, with every link read taking the caller's reader predicate and returning no link whose home that reader may not read (what a surviving link contributes comes back whole), owning no state and no index"
readme = "README.md"

[dependencies]
# The result-set carrier: M7's link reads return im::OrdSet<Address> (address
# order = ASN-0108's permanent enumeration key), which M8 walks, pages, probes
# and unions as OrdSets, turning them into Vec<Address> only at the output
# boundary; src/sets.rs states how the sets are walked. M8 serializes nothing,
# so no serde feature is needed.
im.workspace = true
# Nat::one()/is_zero() are trait fns the delete-orphan ordinal math keeps in
# scope, and to_usize the one the image's walk price reads a span's reach
# through.
num-traits.workspace = true
# M1 — the value calculus. M8 holds no address algebra of its own.
skep-address = { path = "../skep-address" }
# M2 — one snapshot per operation; M8 writes nothing and owns no ordering,
# durability, or recovery.
skep-kernel = { path = "../skep-kernel" }
# M3 — the document-existence gate every read that names a document asks first.
skep-namespace = { path = "../skep-namespace" }
# M5 — the arrangement M8 resolves through, counts the runs of, and projects
# into; the head-float pin; and the ordinal V-span shape the region gate asks
# with. M8 never reads R.
skep-arrangement = { path = "../skep-arrangement" }
# M7 — the link store and the matcher M8 presents. M8 restates one piece of it,
# the per-link overlap relation, as `pointwise::SpanBounds::overlaps`, because
# M7 keeps that test private: a change to M7's overlap is a change to
# `overlaps` too, and tests/it/pointwise.rs holds the two to one answer on
# every relation `classify_spans` draws.
skep-links = { path = "../skep-links" }

[dev-dependencies]
# M2's actual wire format: the lineage suite decodes a supersession deposit
# from bincode bytes, the way a restored checkpoint or a replayed journal
# frame reaches M7's fold, to place a claim no M7 writer deposits.
bincode.workspace = true
# The assembled test world derives Serialize/Deserialize (M2's WorldState bound).
serde.workspace = true
# Lets the test world drive M5's INSERT so the discovery queries have arranged
# content to resolve (the skep-links test-scaffold precedent).
skep-content = { path = "../skep-content" }
# M3 again with `test-hooks` on: the suite seeds M3 state by folding records
# built with `M3Rec`'s test constructors, its variants being sealed.
skep-namespace = { path = "../skep-namespace", features = ["test-hooks"] }

[lints.clippy]
# A test that asserts a result succeeded unwraps it — `expect`, or `err()`
# compared with `None` where the message names the case — so a failure prints
# the refusal it got. This refuses the bare `assert!(r.is_ok())`, which prints
# only the expression, in every target of the crate, and `deny` fails any
# clippy run on one.
assertions_on_result_states = "deny"
