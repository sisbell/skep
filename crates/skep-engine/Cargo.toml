[package]
name = "skep-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The single assembler (Engine Composition Contract): the one concrete World over every store slice, the one central Record enum, the constant genesis, the pinned recovery order, the exception set over M3's publication bit, and the world dump surface"
readme = "README.md"

[features]
# `dump` gates the WorldDump surface for the conformance/crash harnesses.
# Default-ON so the workspace gate (build/clippy/test) exercises the dump path
# and its tests; a production binary opts out with `default-features = false`.
default = ["dump"]
dump = []

[dependencies]
# The World/Record serde derives satisfying M2's WorldState bounds.
serde.workspace = true
# The exception set (PUB-7.5) — a persistent hash map draft → owner account,
# so the World's per-transact clone stays a root clone. The serde feature is
# the workspace's; the set itself is `#[serde(skip)]` (derived, never
# checkpointed).
im.workspace = true
# M1 — Tumbler/Address construction for the standard reserved type addresses
# and the world dump's address rendering.
skep-address = { path = "../skep-address" }
# M2 — Kernel::open over the assembled World; WorldState is implemented here.
skep-kernel = { path = "../skep-kernel" }
# M3–M7 — the four state-contributing store crates: one slice, one record
# variant, one accessor impl, one fold dispatch apiece.
skep-namespace = { path = "../skep-namespace" }
skep-content = { path = "../skep-content" }
skep-arrangement = { path = "../skep-arrangement" }
skep-links = { path = "../skep-links" }
# M9 — the Coordinator is engine-assembled: the factory bodies presuppose the
# engine can build Vstream/LinkWriter from &Kernel<W> (M9's standing assembly
# obligation), and its catalog projects the engine-built registry.
skep-coordination = { path = "../skep-coordination" }
# M10 — the demand side: EngineStores realizes the Stores<World> factory the
# transport injects into Operation::new. M10 stays generic; only the binary
# and this assembler ever name World against it.
skep-febe = { path = "../skep-febe" }

[dev-dependencies]
# M6/M8 — pure readers (no slice, no record): exercised by the cross-store
# lifecycle test, never needed by the assembly itself.
skep-retrieval = { path = "../skep-retrieval" }
skep-discovery = { path = "../skep-discovery" }
# Fsync journals for the lifecycle/recovery tests; bincode is M2's actual
# wire format — the genesis-determinism test compares two Σ₀ through it, and
# the load-check tests hand-build the pre-publication checkpoint shapes.
tempfile.workspace = true
bincode.workspace = true
# The load-check test rewrites a checkpoint's body under a VALID header, so
# the decode — not the checksum — is what refuses it: M2's header checksum
# is CRC32C (the same crate and version skep-kernel pins).
crc32c = "0.6"
