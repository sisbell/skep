[package]
name = "skep-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "The library every acting skep client embeds: the one outbound dialer, bare and signed sessions, the key store, the signing seam over the hybrid key, the reader's verifier, the claim ceremony and the compositions every later ceremony runs over (client.md)"
readme = "README.md"

[features]
# `acting` — the ACTING half (client.md §1.1's graph): `sign`, `store`,
# `ceremony`, `person`, `sheet`, the reader's `verify` and the `skep-resolve`
# edge. DEFAULT ON. It alone turns `skep-signature`'s `sign` on; a daemon
# that embeds this crate's dialer takes it with `default-features = false`,
# so its build graph holds no signer (AUTH-2.2 under feature unification).
default = ["acting"]
acting = ["skep-signature/sign", "dep:skep-resolve", "dep:getrandom"]
# `tls` — `https://` through rustls and the platform verifier (§9 item 12).
# OFF here; the `skep` binary and the frontend's shell turn it on. The
# sidecar image builds the binary `--no-default-features`.
tls = ["dep:rustls", "dep:rustls-platform-verifier"]
# `test-hooks` compiles in the test support: `person::scripted`, the scripted
# person a suite drives through a walk — and implies `acting`, the half that
# holds the `Person` seam. DEFAULT-OFF, and no shipped build enables it: this
# crate's own tests turn it on through the self dev-dependency below, and
# skep-cli's tests on their `skep-client` line, so a build that compiles no
# test compiles none of it. `scripts/gate-full.sh`'s `--features acting`
# check builds the library without it, and `tests/it/tidy.rs` checks the
# gate on the module's `mod` line.
test-hooks = ["acting"]
# `search` — THE SHELL's HALF of search (client.md §4e; lane SH): the feed
# consumer over `/changes`, the index directory beside the key store, the
# resume at open, the session's triggers, the document index the plane
# reads, the state event's ten arms, the bridge call that composes the pair
# and the jump's landing rule — the `search` module, over `skep-search`.
# OFF BY DEFAULT, as `tls` is: the default build of the library holds no
# feed consumer and makes no content read, so client.md §1.1's fence ("no
# `/changes` FEED consumer") stays true of it as written; the frontend's
# shell and the `skep` command's search turn it on, as the shell turns `tls`
# on. Implies `acting`: the supplement needs a session.
search = ["acting", "dep:skep-search"]

[dependencies]
# M1 — the address vocabulary the entry frame and the walks spell addresses
# in; every address this crate names is parsed to one before it is framed.
skep-address = { path = "../skep-address" }
# The record schemas and their canonical encoders, the framing tags, the key
# and fingerprint types, the entry frame and its body builders (AUTH-5.67).
skep-identity = { path = "../skep-identity" }
# The signature ARITHMETIC: verify in every build; keygen from a seed and
# signing under `sign`, which `acting` turns on. The one crate that links the
# signature libraries — linked THROUGH it, never here (AUTH-2.2; RES-62).
skep-signature = { path = "../skep-signature" }
# The registry walk, over this crate's one dialer: the shell dials the board
# the registry names (P25). Behind `acting`; no cycle, no second trait.
skep-resolve = { path = "../skep-resolve", optional = true }
# The search index a client embeds (search.md §1.2) — the engine the
# `search` module feeds and queries. Behind `search`, OFF by default; a
# NORMAL dependency pointing DOWN (skep-search stands before this crate in
# ARCHITECTURE.md's code map), where skep-search's own dev-dependency on
# this crate — its budgets suite's dev board — is the upward one Cargo
# admits as a dev-cycle.
skep-search = { path = "../skep-search", optional = true }
# The wire frames and the key file.
serde_json.workspace = true
# OS entropy: seeds, the backup moment's per-run token, `new_id`.
getrandom = { workspace = true, optional = true }
# The `tls` arm.
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }

[dev-dependencies]
# This crate itself with `test-hooks` on, so its integration tests
# (tests/it, outside this library's `cfg(test)`) drive the walks through the
# scripted person under a plain `cargo test` or workspace run, no flag added.
# A build that compiles no test never reads this table. `default-features =
# false`, so this line adds `test-hooks` (and the `acting` it implies) and
# `search` — so the `search` module's suites compile and run under a plain
# `cargo test` and the workspace gate, no flag added — and nothing else.
skep-client = { path = ".", features = ["test-hooks", "search"], default-features = false }
# The index's own types, named by the search suites directly — the units
# they feed, the pair's inputs they check — with no feature of its own.
skep-search = { path = "../skep-search" }
# The real daemon, in-process on an ephemeral port over a temp data dir, as
# skep-mcp's suite takes it: `test-hooks` is what that suite enables too.
skepd = { path = "../skepd", features = ["test-hooks"] }
tempfile.workspace = true
# The suite signs attests of its own to judge against the reader's verifier.
skep-signature = { path = "../skep-signature", features = ["sign"] }
# The namespace's own principal-depth bound, which `ceremony::enumerate`
# reproduces and never links: its suite holds the two equal, as `origin`'s
# vector set holds the daemon's grammar (P5). Already in the graph through
# skepd.
skep-namespace = { path = "../skep-namespace" }
